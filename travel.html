<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Travel Explorer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="travel.css">
</head>

<body class="bg-light">

    <header class="text-center py-3 bg-primary text-white">
        <h2 class="fw-bold">🌍 Travel Explorer</h2>
    </header>

    <main class="container py-4">

        <!-- Carousel -->
        <div id="travelSlides" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-inner">

                <div class="carousel-item active" data-bs-interval="2500">
                    <img src="https://plus.unsplash.com/premium_photo-1661919210043-fd847a58522d?fm=jpg&q=60&w=3000&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8cGFyaXN8ZW58MHx8MHx8fDA%3D" class="d-block w-100" width="400" height="450">
                    <div class="carousel-caption">
                        <h5>Paris</h5>
                    </div>
                </div>

                <div class="carousel-item" data-bs-interval="2500">
                    <img src="https://www.shutterstock.com/image-photo/ulun-danu-temple-bratan-lake-600nw-2601531619.jpg" class="d-block w-100" width="400" height="450">
                    <div class="carousel-caption">
                        <h5>Bali</h5>
                    </div>
                </div>

                <div class="carousel-item" data-bs-interval="2500">
                    <img src="https://t4.ftcdn.net/jpg/02/51/12/11/360_F_251121174_5xQyUCqSrkswyLHbM9Ne8DQ8Qb0o1HGw.jpg" class="d-block w-100" width="400" height="450">
                    <div class="carousel-caption">
                        <h5>Tokyo</h5>
                    </div>
                </div>

            </div>
        </div>

        <div class="mt-4">
            <p class="mb-1 fw-bold">Bookings Progress</p>
            <div class="progress">
                <div class="progress-bar bg-success progress-bar-striped progress-bar-animated" style="width:70%">
                    70%
                </div>
            </div>
        </div>

    </main>

    <footer class="text-center py-3 bg-white mt-4">
        <small>Contact: travel@explorer.com | +91-7983055XXX</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
