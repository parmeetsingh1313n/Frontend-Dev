<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Pricing Plans</title>
    <link rel="stylesheet" href="T5.css">
</head>

<body>
    <section class="pricing">
        <h1>Our Pricing Plans</h1>

        <div class="cards">
            <div class="card">
                <h2>Basic</h2>
                <p class="price">₹90/mo</p>
                <ul>
                    <li>2 Projects</li>
                    <li>Email Support</li>
                    <li>Community Access</li>
                </ul>
                <a href="#" class="btn">Choose Plan</a>
            </div>

            <div class="card popular">
                <h2>Standard</h2>
                <p class="price">₹190/mo</p>
                <ul>
                    <li>10 Projects</li>
                    <li>Priority Support</li>
                    <li>Custom Features</li>
                </ul>
                <a href="#" class="btn">Choose Plan</a>
            </div>

            <div class="card">
                <h2>Premium</h2>
                <p class="price">₹290/mo</p>
                <ul>
                    <li>Unlimited Projects</li>
                    <li>24/7 Support</li>
                    <li>Advanced Tools</li>
                </ul>
                <a href="#" class="btn">Choose Plan</a>
            </div>
        </div>
    </section>
</body>

</html>
