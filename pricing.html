<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Pricing Plans</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="pricing.css">
</head>

<body>

    <main class="container py-5 text-center">
        <h2 class="mb-4 fw-bold">Choose Your Plan</h2>

        <div class="row g-4">

            <div class="col-md-4">
                <div class="card p-3 shadow-sm plan">
                    <h5>Basic</h5>
                    <p class="fw-bold">₹100 / month</p>
                    <p>Email Support</p>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card p-3 shadow-sm bg-primary text-white plan">
                    <h5>Pro (Popular)</h5>
                    <p class="fw-bold">₹1700 / month</p>
                    <p> Priority Support<br> Cloud Backup</p>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card p-3 shadow-sm plan">
                    <h5>Enterprise</h5>
                    <p class="fw-bold">₹3500 / month</p>
                    <p>Dedicated Manager</p>
                </div>
            </div>

        </div>
    </main>

</body>

</html>
