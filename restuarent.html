<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Today's Menu — Foodies Cafe</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="restuarent.css">
</head>

<body class="bg-light">

    <header class="py-4 text-center">
        <h2 class="fw-bold text-success">The Foodie Cafe — Today’s Menu</h2>
    </header>

    <main class="container">

        <section class="text-center mb-4">
            <img src="https://b.zmtcdn.com/data/reviews_photos/607/93c1330c8757dbb8f19420ef50717607_1457958914.jpg?fit=around|750:500&crop=750:500;*,*" class="img-fluid rounded shadow-sm"
                alt="Delicious Food Image">
            <p class="lead mt-2">Freshly prepared meals — just like home</p>
        </section>

        <section class="mb-4">
            <h4 class="text-primary">Menu Table</h4>
            <table class="table table-bordered text-center">
                <thead class="table-secondary">
                    <tr>
                        <th>Dish</th>
                        <th>Category</th>
                        <th>Price</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Pao Bhaji</td>
                        <td>Indian</td>
                        <td>₹120</td>
                    </tr>
                    <tr>
                        <td>Veg Pasta</td>
                        <td>Continental</td>
                        <td>₹150</td>
                    </tr>
                    <tr>
                        <td>Soya Chaap</td>
                        <td>Healthy Food</td>
                        <td>₹220</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <section>
            <h4 class="text-primary">Chef’s Specials</h4>
            <ul class="list-group">
                <li class="list-group-item">Spicy Paneer Tikka</li>
                <li class="list-group-item">Garlic Butter Prawns</li>
            </ul>
        </section>

    </main>

    <footer class="text-center py-3 bg-white mt-4">
        <small>&copy; 2025 Foodies Cafe </small>
    </footer>

</body>

</html>
