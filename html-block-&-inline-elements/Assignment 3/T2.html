<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Product Catalog</title>
</head>

<body>

    <h1>Simple Product Catalog</h1>

    <table border="1">
        <caption>Store Products</caption>
        <thead>
            <tr>
                <th>Product</th>
                <th>Description</th>
                <th>Price</th>
                <th>Availability</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>
                    <img src="/headphone.png" alt="SP 1" width="80" height="80">
                    <div>Boat Headphones</div>
                </td>
                <td>Comfortable, noise-cancelling headphones</td>
                <td>₹2,499</td>
                <td>In stock</td>
            </tr>
            <tr>
                <td>
                    <img src="/bottle.png" alt="SP 2" width="80" height="80">
                    <div>Milton Bottle</div>
                </td>
                <td>Stainless steel, 1L</td>
                <td>₹499</td>
                <td>Out of stock</td>
            </tr>
        </tbody>
    </table>

</body>

</html>
