<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Course Registration Form</title>
</head>

<body>

    <h1>Course Registration</h1>
    <form>
        <fieldset>
            <legend>Student Details</legend>
            <label for="name">Name:</label>
            <input id="name" name="name" type="text" placeholder="enter your name"><br><br>

            <label for="email">Email:</label>
            <input id="email" name="email" type="email" placeholder="you@gmail.com">
        </fieldset>

        <fieldset>
            <legend>Choose Course</legend>
            <label for="course">Course:</label>
            <select id="course" name="course">
                <option value="html" selected>HTML Basics</option>
                <option value="css">CSS Fundamentals</option>
                <option value="js">JavaScript Intro</option>
            </select>
        </fieldset>
    </form>

    <h2>Available Schedules</h2>
    <table border="1">
        <thead>
            <tr>
                <th>Day</th>
                <th>Time</th>
                <th>Instructor</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Monday</td>
                <td>2:00 PM - 6:00 PM</td>
                <td>Mr. Akash Gupta</td>
            </tr>
            <tr>
                <td>Tuesday</td>
                <td>2:00 PM - 4:00 PM</td>
                <td>Mr. Akash Gupta</td>
            </tr>
        </tbody>
    </table>

</body>

</html>
