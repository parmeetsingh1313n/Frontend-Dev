<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 5 ->> Responsive Product Cards</title>
    <link rel="stylesheet" href="Task5.css" />
</head>

<body>
    <main class="product-section">
        <h1>MY Products</h1>
        <div class="product-grid">
            <div class="card">
                <img src="https://images.pexels.com/photos/90946/pexels-photo-90946.jpeg?cs=srgb&dl=pexels-madebymath-90946.jpg&fm=jpg"
                    alt="Product 1">
                <h2>Product 1</h2>
                <p>Simple and clean product description goes here.</p>
                <button>Add to Cart</button>
            </div>

            <div class="card">
                <img src="https://media.istockphoto.com/id/1414801672/photo/cardboard-box-with-cosmetics-product-in-front-od-open-door-buying-online-and-delivery.jpg?s=612x612&w=0&k=20&c=SA9VCzp-QtpzlliX8dM_uoH8K20U1gHqYfsWP08aLl0=" alt="Product 2">
                <h2>Product 2</h2>
                <p>Elegant design with modern touch for daily use.</p>
                <button>Add to Cart</button>
            </div>

            <div class="card">
                <img src="https://cdn.shopify.com/s/files/1/0070/7032/articles/diy-product-photography_efc47372-bfea-483c-9c10-6459447e27a4.jpg?v=1758062255&originalWidth=1848&originalHeight=782" alt="Product 3">
                <h2>Product 3</h2>
                <p>High-quality material and long-lasting performance.</p>
                <button>Add to Cart</button>
            </div>

            <div class="card">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQvF_FW6eOVrOiQdxenxcjucUftZo6H9TdYzg&s" alt="Product 4">
                <h2>Product 4</h2>
                <p>Compact, durable, and affordable everyday product.</p>
                <button>Add to Cart</button>
            </div>
        </div>
    </main>
</body>

</html>
