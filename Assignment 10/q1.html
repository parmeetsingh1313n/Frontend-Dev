<!Doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Q1 — Live Search</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            font-family: Arial;
            padding: 16px
        }

        #results {
            margin-top: 12px;
        }

        .product {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 8px;
            border-bottom: 1px solid #eee;
        }

        .product img {
            width: 80px;
            height: 50px;
            object-fit: cover
        }

        .loading {
            color: #888;
            margin-top: 8px
        }

        .empty {
            color: #b00;
            margin-top: 8px
        }
    </style>
</head>

<body>
    <h2>Live Product Search</h2>
    <input id="search" placeholder="Type to search products..." style="width:400px;padding:8px" />
    <div id="loading" class="loading" style="display:none">Loading...</div>
    <div id="results"></div>

    <script src="q1.js"></script>
</body>

</html>
