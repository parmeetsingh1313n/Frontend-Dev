<!Doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Q4 — Multi-API Dashboard</title>
    <style>
        body {
            font-family: Arial;
            padding: 16px
        }

        .card {
            display: inline-block;
            padding: 12px;
            border: 1px solid #eee;
            margin-right: 12px;
            width: 150px;
            text-align: center
        }

        .skeleton {
            background: #eee;
            height: 20px;
            margin: 8px 0
        }

        .warn {
            color: #b50;
            margin-top: 8px
        }
    </style>
</head>

<body>
    <h2>Dashboard</h2>
    <div id="dashboard">
        <div class="card" id="users">
            <div class="skeleton">Loading...</div>
        </div>
        <div class="card" id="orders">
            <div class="skeleton">Loading...</div>
        </div>
        <div class="card" id="products">
            <div class="skeleton">Loading...</div>
        </div>
    </div>
    <div id="warn" class="warn" style="display:none">Some data could not be loaded.</div>

    <script src="q4.js"></script>
</body>

</html>
