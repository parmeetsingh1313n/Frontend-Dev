<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Task 8 — Box Sizing</title>
    <link rel="stylesheet" href="task8-box.css" />
</head>
<body>
    <main class="compare">
        <div class="box-wrapper">
            <h3>content-box (default)</h3>
            <div class="box content">content-box</div>
            <p class="desc">Padding and border added outside width.</p>
        </div>

        <div class="box-wrapper">
            <h3>border-box</h3>
            <div class="box border">border-box</div>
            <p class="desc">Padding and border included inside width.</p>
        </div>
    </main>
</body>
</html>
