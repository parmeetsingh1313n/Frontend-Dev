<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Task 10 — Mini UI</title>
    <link rel="stylesheet" href="task10-ui.css" />
</head>
<body>
    <header class="site-header">
        <h1>Mini UI</h1>
    </header>
    <main class="center-card">
        <section class="card">
            <form>
                <label for="name">Name</label>
                <input id="name" type="text" required />
                <div class="row">
                    <button type="submit">Submit</button>
                    <button type="button">Cancel</button>
                </div>
            </form>
            <img src="https://images.examples.com/wp-content/uploads/2018/11/forms-in-word.jpg" alt="form img" width="200px" height="100px" />
        </section>
    </main>
    <footer class="site-footer"><small>Made by Parmeet Singh</small></footer>
</body>
</html>
