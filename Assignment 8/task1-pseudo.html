<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Task 1 — Pseudo-Classes</title>
    <link rel="stylesheet" href="task1-pseudo.css" />
</head>

<body>
    <header>
        <h1>Pseudo-Classes</h1>
    </header>
    <main class="row">
        <!-- Link example -->
        <section class="card">
            <div class="example">
                <a href="www.google.com" class="google">Google</a>
            </div>
            <div class="note">
                <p><strong>:hover</strong> and <strong>:active</strong> on links — explain briefly here.</p>
            </div>
        </section>

        <!-- Button example -->
        <section class="card">
            <div class="example">
                <button class="demo-btn">Demo Button</button>
            </div>
            <div class="note">
                <p><strong>:hover</strong>, <strong>:active</strong>, <strong>:focus</strong> on button.</p>
            </div>
        </section>

        <!-- List / nth-child example -->
        <section class="card">
            <div class="example">
                <ul class="demo-list">
                    <li>One</li>
                    <li>Two</li>
                    <li>Three</li>
                    <li>Four</li>
                </ul>
            </div>
            <div class="note">
                <p><strong>:nth-child()</strong> alternates styles — short explanation.</p>
            </div>
        </section>
    </main>
    <footer> Copyright &copy; by Parmeet Singh </footer>
</body>
</html>
