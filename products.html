<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Product Catalog</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="products.css">
</head>

<body class="bg-light">

    <header class="text-center py-3 bg-dark text-white">
        <h2 class="fw-bold">DMart Store</h2>
    </header>

    <main class="container py-4">
        <div class="row g-4">
            <div class="col-12 col-md-6 col-lg-3">
                <div class="card product">
                    <img src="https://www.orgpick.com/cdn/shop/articles/Apple_1024x1024.jpg?v=1547124407" class="card-img-top" width="300" height="200">
                    <div class="card-body text-center">
                        <h5>Organic Apples</h5>
                        <p class="fw-bold text-success">₹100/kg</p>
                        <button class="btn btn-primary btn-sm">Add to Cart</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-3">
                <div class="card product">
                    <img src="https://media.istockphoto.com/id/1448038415/photo/dark-chocolate-bar-pieces-on-dark-background-with-grated-chocolate-pile-chunks-of-broken.jpg?s=612x612&w=0&k=20&c=ACUkEGDUkVU56CzqDLOhOKEWh_Xo8HKhXbYh_7dmis0=" class="card-img-top" width="300" height="200">
                    <div class="card-body text-center">
                        <h5>Dark Chocolates</h5>
                        <p class="fw-bold text-success">₹70</p>
                        <button class="btn btn-primary btn-sm">Add to Cart</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-3">
                <div class="card product">
                    <img src="https://opensecret.in/cdn/shop/products/OpenSecretdryfruits_nutscombo.jpg?v=1673869712" class="card-img-top" width="300" height="200">
                    <div class="card-body text-center">
                        <h5>Dry Nuts Pack</h5>
                        <p class="fw-bold text-success">₹900/kg</p>
                        <button class="btn btn-primary btn-sm">Add to Cart</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-3">
                <div class="card product">
                    <img src="https://www.designerpeople.com//wp-content/uploads/2020/03/fruit-juice-packaging-design-3.jpg" class="card-img-top" width="300" height="200">
                    <div class="card-body text-center">
                        <h5>Fruit Juice</h5>
                        <p class="fw-bold text-success">₹300</p>
                        <button class="btn btn-primary btn-sm">Add to Cart</button>
                    </div>
                </div>
            </div>

        </div>
    </main>
</body>
</html>
