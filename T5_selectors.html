<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Selectors Demo</title>
    <link rel="stylesheet" href="T5_selectors.css">
</head>

<body>
    <header>
        <h1>Selectors</h1>
    </header>

    <main>
        <form>
            <label>Text: <input type="text" name="name"></label>
            <label>Email: <input type="email" name="email"></label>
            <label>Search: <input type="search" name="search"></label>
        </form>

        <ul class="links">
            <li><a href="https://google.com">Google</a></li>
            <li><a href="http://site.local">Local</a></li>
            <li><a href="https://secure.example">Secure</a></li>
            <li><a href="#anchor">Anchor</a></li>
        </ul>

        <ol>
            <li>First</li>
            <li>Second</li>
            <li>Third</li>
            <li>Fourth</li>
        </ol>
    </main>
</body>

</html>
