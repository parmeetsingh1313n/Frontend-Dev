<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Task 6 — Table Filter</title>
    <style>
        body {
            font-family: Arial;
            padding: 16px
        }

        table {
            border-collapse: collapse;
            width: 100%
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 8px
        }

        #nores {
            display: none;
            color: #b00;
            margin-top: 8px
        }
    </style>
</head>

<body>
    <h2>Student Table</h2>
    <input id="search" placeholder="Search by name/branch..." style="width:300px;padding:6px" />

    <table id="tbl" style="margin-top:8px">
        <thead>
            <tr>
                <th>Name</th>
                <th>Branch</th>
                <th>CGPA</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Parmeet</td>
                <td>CSE</td>
                <td>8.4</td>
            </tr>
            <tr>
                <td>Saran</td>
                <td>ECE</td>
                <td>9.1</td>
            </tr>
            <tr>
                <td>Karan</td>
                <td>ME</td>
                <td>7.8</td>
            </tr>
            <tr>
                <td>Neha</td>
                <td>CSE</td>
                <td>8.0</td>
            </tr>
        </tbody>
    </table>

    <div id="nores">No results found</div>

    <script>
        const search = document.getElementById('search');
        const tbody = document.querySelector('#tbl tbody');
        const nores = document.getElementById('nores');

        search.addEventListener('input', () => {
            const q = search.value.trim().toLowerCase();
            let matches = 0;
            Array.from(tbody.rows).forEach(row => {
                const name = row.cells[0].textContent.toLowerCase();
                const branch = row.cells[1].textContent.toLowerCase();
                const show = !q || name.includes(q) || branch.includes(q);
                row.style.display = show ? '' : 'none';
                if (show) matches++;
            });
            nores.style.display = matches ? 'none' : 'block';
        });
    </script>
</body>

</html>
