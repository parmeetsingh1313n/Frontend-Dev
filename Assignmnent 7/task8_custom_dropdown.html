<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Task 8 — Custom Dropdown</title>
    <style>
        body {
            font-family: Arial;
            padding: 16px
        }

        .dropdown {
            position: relative;
            display: inline-block
        }

        .btn {
            padding: 8px 12px;
            border: 1px solid #888;
            cursor: pointer
        }

        .menu {
            position: absolute;
            top: 100%;
            left: 0;
            border: 1px solid #ccc;
            background: #fff;
            padding: 6px;
            display: none
        }

        .menu .opt {
            padding: 6px;
            cursor: pointer
        }

        .menu .opt:hover {
            background: #eef
        }
    </style>
</head>

<body>
    <h2>Custom Dropdown</h2>
    <div class="dropdown" id="dd">
        <div class="btn" id="ddBtn">Choose an option</div>
        <div class="menu" id="ddMenu">
            <div class="opt">Option A</div>
            <div class="opt">Option B</div>
            <div class="opt">Option C</div>
        </div>
    </div>

    <script>
        const dd = document.getElementById('dd');
        const btn = document.getElementById('ddBtn');
        const menu = document.getElementById('ddMenu');

        btn.addEventListener('click', () => menu.style.display = menu.style.display === 'block' ? 'none' : 'block');

        menu.addEventListener('click', (e) => {
            if (e.target.classList.contains('opt')) {
                btn.textContent = e.target.textContent;
                menu.style.display = 'none';
            }
        });

        document.addEventListener('click', (e) => {
            if (!dd.contains(e.target)) menu.style.display = 'none';
        }, true);
    </script>
</body>

</html>
