<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Task 5 — Gallery Modal</title>
    <style>
        body {
            font-family: Arial;
            padding: 16px
        }

        .grid {
            display: flex;
            gap: 8px;
            flex-wrap: wrap
        }

        .grid img {
            width: 150px;
            height: 100px;
            object-fit: cover;
            cursor: pointer;
            border: 1px solid #ccc
        }

        .modal {
            position: fixed;
            left: 0;
            top: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, .6);
            display: flex;
            align-items: center;
            justify-content: center
        }

        .modal .box {
            background: #fff;
            padding: 8px;
            border-radius: 6px;
            max-width: 90%;
            max-height: 90%
        }

        .modal img {
            max-width: 100%;
            max-height: 80vh
        }
    </style>
</head>

<body>
    <h2>Image Gallery</h2>
    <div class="grid" id="grid">
        <img src="https://picsum.photos/seed/1/600/400" alt="">
        <img src="https://picsum.photos/seed/2/600/400" alt="">
        <img src="https://picsum.photos/seed/3/600/400" alt="">
        <img src="https://picsum.photos/seed/4/600/400" alt="">
        <img src="https://picsum.photos/seed/5/600/400" alt="">
        <img src="https://picsum.photos/seed/6/600/400" alt="">
    </div>

    <script>
        const grid = document.getElementById('grid');

        grid.addEventListener('click', (e) => {
            if (e.target.tagName !== 'IMG') return;
            openModal(e.target.src);
        });

        function openModal(src) {
            const modal = document.createElement('div'); modal.className = 'modal';
            modal.innerHTML = `<div class="box"><img src="${src}" alt="large"></div>`;
            modal.addEventListener('click', () => modal.remove());
            // stop clicks inside box from closing
            modal.querySelector('.box').addEventListener('click', (ev) => ev.stopPropagation());
            document.body.appendChild(modal);
        }
    </script>
</body>

</html>
