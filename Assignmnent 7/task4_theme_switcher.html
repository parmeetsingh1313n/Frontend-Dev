<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Task 4 — Theme Switcher</title>
    <style>
        body {
            font-family: Arial;
            padding: 16px;
            transition: background .3s, color .3s;
        }

        [data-theme="light"] {
            background: #fff;
            color: #111;
        }

        [data-theme="dark"] {
            background: #1a1a1a;
            color: #eee;
        }

        [data-theme="blue"] {
            background: #e6f0ff;
            color: #0b3d91;
        }

        .btn {
            padding: 8px 12px;
            margin-right: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body data-theme="light">
    <h2>Theme Switcher</h2>
    <button class="btn" data-theme="light">Light</button>
    <button class="btn" data-theme="dark">Dark</button>
    <button class="btn" data-theme="blue">Blue</button>

    <script>
        const btns = document.querySelectorAll('.btn');
        btns.forEach(b => {
            b.addEventListener('click', () => {
                const theme = b.dataset.theme;
                document.body.setAttribute('data-theme', theme);
                document.body.setAttribute('data-theme-saved', theme);
            });
        });

        // restore saved theme if present
        const saved = document.body.getAttribute('data-theme-saved');
        if (saved) document.body.setAttribute('data-theme', saved);
    </script>
</body>

</html>
