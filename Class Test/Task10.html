<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 10 - Form UI Layout</title>
    <link rel="stylesheet" href="task10.css">
</head>

<body>
    <header>
        <h1>Form UI Layout</h1>
    </header>

    <main>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1625225230517-7426c1be750c?ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Nnx8Zm9ybXxlbnwwfHwwfHx8MA%3D%3D&fm=jpg&q=60&w=3000" alt="Sample" width="200px" height="100px">
            <form>
                <input type="text" placeholder="Your name">
                <input type="email" placeholder="Email">
                <div class="buttons">
                    <button type="submit">Submit</button>
                    <button type="reset">Reset</button>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <p>© 2025 PS</p>
    </footer>
</body>

</html>
