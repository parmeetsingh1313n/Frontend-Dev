<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase Layout</title>
    <link rel="stylesheet" href="task3.css">
</head>

<body>
    <header>
        <h2>Image Showcase</h2>
    </header>

    <main class="gallery">
        <figure>
            <img src="https://media.istockphoto.com/id/108327817/photo/lake-plansee-tirol-austria.jpg?s=612x612&w=0&k=20&c=FKIudoqwHFtceB6w_jYJcAQA743TFlEJMf4lkHzi1iU=" alt="Nature 1">
            <figcaption>Calm Lake</figcaption>
        </figure>
        <figure>
            <img src="https://media.istockphoto.com/id/1320836656/photo/field-of-ripe-golden-wheat-in-rays-of-sunlight-at-sunset-against-background-of-sky-with-clouds.jpg?s=612x612&w=0&k=20&c=nw5mX4s-LI9ofPQjQv5S6u8Alui7ago6GXzYi7d4JuU=" alt="Nature 2">
            <figcaption>Golden Fields</figcaption>
        </figure>
        <figure>
            <img src="https://cdn.britannica.com/73/189273-050-355658ED/Denali-peak-center-Alaska-Range-North-America.jpg" alt="Nature 3">
            <figcaption>Mountain Peaks</figcaption>
        </figure>
        <figure>
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQLwsNBZboqTeZNuF1lUMv_vnuwkus3a7Ea_w&s" alt="Nature 4">
            <figcaption>Forest Path</figcaption>
        </figure>
        <figure>
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRpwipETbw6yUt27eDrbxi_tpU1WaFoG10oYw&s" alt="Nature 5">
            <figcaption>Desert Sunset</figcaption>
        </figure>
        <figure>
            <img src="https://media.istockphoto.com/id/162542504/photo/earth-sunrise-in-space.jpg?s=612x612&w=0&k=20&c=yOz6xe894yVDOtt29uFDybMbNyKdpW_4vOUUEkAlaEI=" alt="Nature 6">
            <figcaption>Blue Horizon</figcaption>
        </figure>
    </main>
</body>

</html>
