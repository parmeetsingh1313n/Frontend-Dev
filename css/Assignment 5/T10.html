<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Complete Layout</title>
    <link rel="stylesheet" href="T10.css">
</head>

<body>
    <header class="topnav">
        <div class="logo">Talk2Hire</div>
        <nav><a href="#">Home</a><a href="#about">About</a><a href="#contact">Contact</a></nav>
    </header>

    <section class="hero">
        <div class="hero-text">Welcome to Talk2Hire</div>
    </section>

    <section id="about" class="about">
        <div class="col-text">
            <h2>About</h2>
            <p>Short about text of owner.... Shows relative and absolute positioning in the demo.</p>
        </div>
        <div class="col-img"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRCht7rRYOLycLwddc2crPZPRvbCrZrda5nJQ&s" alt="about image"></div>
    </section>

    <section class="services">
        <div class="service">Service - 1</div>
        <div class="service">Service - 2</div>
        <div class="service">Service - 3</div>
    </section>

    <section id="contact" class="contact">
        <form>
            <label>Name<input type="text" required></label>
            <label>Email<input type="email" required></label>
            <button type="submit">Send</button>
        </form>
    </section>

    <footer class="sitefoot">© 2025 Parmeet Singh</footer>
</body>

</html>
