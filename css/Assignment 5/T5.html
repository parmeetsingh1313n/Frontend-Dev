<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Pricing Plans</title>
    <link rel="stylesheet" href="T5.css">
</head>

<body>
    <main class="pricing">
        <div class="plan">
            <h3>Basic</h3>
            <ul>
                <li>1 Project</li>
                <li>Basic Support</li>
                <li>100 MB Storage</li>
            </ul>
            <div class="price">₹200</div>
            <a class="btn" href="#">Choose</a>
        </div>

        <div class="plan popular">
            <h3>Standard</h3>
            <ul>
                <li>5 Projects</li>
                <li>Priority Support</li>
                <li>5 GB Storage</li>
            </ul>
            <div class="price">₹500</div>
            <a class="btn" href="#">Choose</a>
        </div>

        <div class="plan">
            <h3>Premium</h3>
            <ul>
                <li>Unlimited Projects</li>
                <li>24/7 Support</li>
                <li>50 GB Storage</li>
            </ul>
            <div class="price">₹1000</div>
            <a class="btn" href="#">Choose</a>
        </div>
    </main>
</body>

</html>
