<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Transforms</title>
    <link rel="stylesheet" href="T6_transform.css">
</head>

<body>
    <header>
        <h1>CSS Transformations</h1>
    </header>

    <main class="flex">
        <div class="item rotate">
            <div class="box">Rotate</div>
            <p>rotate()</p>
        </div>
        <div class="item scale">
            <div class="box">Scale</div>
            <p>scale()</p>
        </div>
        <div class="item translate">
            <div class="box">Move</div>
            <p>translate()</p>
        </div>
        <div class="item skew">
            <div class="box">Skew</div>
            <p>skew()</p>
        </div>
    </main>

    <footer>
        <p>hover each box</p>
    </footer>
</body>

</html>
