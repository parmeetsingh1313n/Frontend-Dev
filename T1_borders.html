<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Borders & Padding Demo</title>
    <link rel="stylesheet" href="T1_borders.css">
</head>

<body>
    <header>
        <h1>Borders & Padding</h1>
    </header>
    <!-- Demo for border & padding -->
    <main class="wrap">
        <div class="box solid">Solid border<br><small>padding:10px</small></div>
        <div class="box dashed">Dashed border<br><small>padding:18px</small>
        </div>
        <div class="box double">Double border<br><small>padding:24px</small>
        </div>
        <div class="box groove">Groove border<br><small>padding:14px</small>
        </div>
        <div class="box rounded">Rounded corners<br><small>border-radius:16px</small>
        </div>
    </main>

    <footer>
        <p>Simple demo — Created by Parmeet!!</p>
    </footer>
</body>
</html>
