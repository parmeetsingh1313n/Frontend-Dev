<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Payment Form</title>
</head>
<body>
    <h2>Online Payment Form</h2>
    <form>
        <label>Cardholder Name:- <input type="text" name="cardname" required></label>
        <br><br>
        <label>Card Number:- <input type="number" name="cardnumber" required></label>
        <br><br>
        <label>Expiry Date:- <input type="month" name="expiry" required></label>
        <br><br>
        <label>CVV:- <input type="password" name="cvv" maxlength="3" required></label>
        <br><br>
        <button type="submit">Pay Now</button>
    </form>
</body>

</html>
