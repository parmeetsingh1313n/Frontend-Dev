<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Secure Form Example</title>
</head>

<body>
    <h2>Secure Form</h2>
    <form autocomplete="off">
        <label>Username:-
            <input type="text" name="username" required>
        </label>
        <br><br>
        <label>Password:-
            <input type="password" name="password" required>
        </label>
        <br><br>
        <button type="submit">Login</button>
    </form>

    <p>Note:-- Turning off autocomplete improves security by preventing the browser from storing sensitive data.</p>
</body>

</html>
