<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Form with Iframe</title>
</head>

<body>
    <h2>Submit Form Below</h2>
    <form action="result.html" target="resultFrame">
        <label>
            Enter Text:-
            <input type="text" name="usertext" required>
        </label>
        <button type="submit">Submit</button>
    </form>

    <h3>Result:-</h3>
    <iframe name="resultFrame" width="80%" height="100" title="Form Result"></iframe>
</body>

</html>
