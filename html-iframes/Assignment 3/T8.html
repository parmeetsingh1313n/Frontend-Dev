<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Feedback Form</title>
</head>

<body>
    <h2>Feedback Form</h2>

    <form method="post" action="#">
        <label>Your Feedback:--</label><br>
        <textarea rows="4" cols="40" required></textarea><br><br>

        <p>Rate our service:--</p>
        <input type="radio" name="rating" value="good"> Good<br>
        <input type="radio" name="rating" value="average"> Average<br>
        <input type="radio" name="rating" value="poor"> Poor<br><br>

        <input type="submit" value="Submit Feedback">
    </form>
</body>
</html>
