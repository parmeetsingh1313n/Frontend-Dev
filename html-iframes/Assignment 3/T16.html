<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>URI Encoding Example</title>
</head>

<body>
    <h2>Search with Special Characters</h2>
    <p>
        Original URL:
        <a href="https://example.com/search?query=HTML & CSS">https://example.com/search?query=HTML & CSS</a>
    </p>
    <p>
        Correct Encoded URL:
        <a
            href="https://example.com/search?query=HTML%20%26%20CSS">https://example.com/search?query=HTML%20%26%20CSS</a>
    </p>
</body>

</html>
