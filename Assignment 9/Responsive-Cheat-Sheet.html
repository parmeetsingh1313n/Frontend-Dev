<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Responsive CSS Cheat Sheet</title>
    <link rel="stylesheet" href="Responsive-Cheat-Sheet.css" />
</head>

<body>
    <main class="cheats">
        <section class="topic">
            <h3>Filters</h3>
            <p>filter: blur(5px);</p>
        </section>
        <section class="topic">
            <h3>Media Queries</h3>
            <p>@media (max-width: 768px)</p>
        </section>
        <section class="topic">
            <h3>Fluid Layouts</h3>
            <p>width: 100%; max-width: 1200px;</p>
        </section>
        <section class="topic">
            <h3>Typography</h3>
            <p>font-size: clamp(1rem, 2vw, 1.5rem);</p>
        </section>
    </main>
</body>

</html>
