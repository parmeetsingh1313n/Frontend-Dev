<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>My Portfolio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light text-dark">

    <header class="text-center mt-4">
        <h1 class="fw-bold">Parmeet Singh</h1>
        <p class="lead">Web Developer & Tech Enthusiast</p>
    </header>

    <main class="container text-center mt-4">
        <img src="https://png.pngtree.com/png-clipart/20200224/original/pngtree-avatar-icon-profile-icon-member-login-vector-isolated-png-image_5247852.jpg" width="200" height="200" class="img-fluid rounded-circle mb-4" alt="Profile">

        <button class="btn btn-primary me-2">Hire Me</button>
        <button class="btn btn-success">Download CV</button>

        <form class="mt-4 mx-auto" style="max-width:400px;">
            <input type="text" class="form-control mb-2" placeholder="Your Name">
            <input type="email" class="form-control mb-2" placeholder="Email">
            <textarea class="form-control mb-2" rows="3" placeholder="Message">
            </textarea>
            <button class="btn btn-dark w-100">Submit</button>
        </form>
    </main>

</body>

</html>
